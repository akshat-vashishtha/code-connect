apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service # [DEPLOYMENT NAME]: Admin deployment controller name
  namespace: codeconnect-dev
  labels:
    app: user-service # [OBJECT LABEL]: Metadata label for grouping this Deployment object
spec:
  replicas: 1 # [REPLICA COUNT]: Desired pod count; autoscaled dynamically by hpa-user-service.yaml
  selector:
    matchLabels:
      app: user-service # [DEPLOYMENT SELECTOR]: Must match spec.template.metadata.labels.app below to supervise pods
  template:
    metadata:
      labels:
        app: user-service # [POD LABEL STICKER]: Attached to created Pods; matched by Service spec.selector.app in user-service.yaml
    spec:
      containers:
        - name: user-service # [CONTAINER PROCESS NAME]: Docker container process name inside the Pod
          image: codeconnect/user-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080 # [CONTAINER PORT]: Must match Service spec.ports.targetPort in user-service.yaml
          envFrom:
            - configMapRef:
                name: user-service-config # [CONFIGMAP LINK]: Injects env vars from configmaps/user-service-configmap.yaml
            - secretRef:
                name: codeconnect-secrets # [SECRET LINK]: Injects secret keys from secrets/secret.yaml
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness # Hits Spring Boot Actuator readiness endpoint
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness # Hits Spring Boot Actuator liveness endpoint
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
