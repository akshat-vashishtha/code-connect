apiVersion: v1
kind: Service
metadata:
  name: mongodb # [SERVICE NAME / DNS HOSTNAME]: Creates mongodb:27017 (Referenced in user-service-configmap.yaml)
  namespace: codeconnect-dev
  labels:
    app: mongodb # [OBJECT LABEL]: Metadata label for grouping this Service object
spec:
  type: ClusterIP
  ports:
    - port: 27017       # [SERVICE PORT]: Exposed port inside cluster
      targetPort: 27017 # [TARGET PORT LINK]: Must match spec.containers.ports.containerPort in mongodb-statefulset.yaml
      name: mongodb
  selector:
    app: mongodb # [TRAFFIC ROUTER SELECTOR]: Must match spec.template.metadata.labels.app in mongodb-statefulset.yaml
