apiVersion: v1
kind: Secret
metadata:
  name: codeconnect-secrets # Secret name; injected via secretRef in deployments/statefulsets
  namespace: codeconnect-dev
type: Opaque
stringData:
  MONGO_ROOT_PASSWORD: "dev_secure_password" # Sample Mongo password reference
  REDIS_PASSWORD: "dev_redis_password"       # Sample Redis password reference
