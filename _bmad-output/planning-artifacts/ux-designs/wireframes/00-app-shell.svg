<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="#f8fafc"/>

  <!-- ========================================================================= -->
  <!-- TOP APP HEADER (Height: 64px)                                             -->
  <!-- ========================================================================= -->
  <rect x="0" y="0" width="1200" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Brand Logo & Platform Title -->
  <rect x="20" y="14" width="36" height="36" rx="8" fill="url(#brandGrad)"/>
  <text x="38" y="38" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">CC</text>
  <text x="68" y="34" fill="#0f172a" font-size="16" font-weight="700">Code<tspan fill="#2563eb">Connect</tspan></text>
  <text x="68" y="48" fill="#64748b" font-size="10" font-weight="500">The Solo Mountain Climb</text>

  <!-- Divider -->
  <line x1="205" y1="18" x2="205" y2="46" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Active Context Breadcrumb -->
  <g transform="translate(222, 21)">
    <!-- Mountain Icon -->
    <rect x="0" y="0" width="22" height="22" rx="5" fill="#eff6ff"/>
    <path d="M 5 17 L 10 9 L 13 14 L 17 8 L 19 17 Z" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="28" y="15" fill="#64748b" font-size="12" font-weight="500">Track 2: Data Structures</text>
    <text x="220" y="15" fill="#94a3b8" font-size="12">/</text>
    <text x="234" y="15" fill="#0f172a" font-size="12" font-weight="600">Foothold 3: Circular Queue</text>
    
    <!-- Active Status Badge with Safe Spacing -->
    <rect x="440" y="2" width="60" height="18" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="470" y="14" fill="#059669" font-size="9" font-weight="700" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- Header Right Utilities (Altitude, Streak, Language, Profile) -->
  <g transform="translate(806, 16)">
    <!-- Altitude Pill -->
    <rect x="0" y="0" width="118" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 12 21 L 18 11 L 22 17 L 25 12 L 28 21 Z" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="20" fill="#334155" font-size="11" font-weight="600">1,420m <tspan fill="#64748b" font-weight="400">/ 4km</tspan></text>

    <!-- Streak Badge -->
    <rect x="126" y="0" width="82" height="32" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <!-- Flame Path -->
    <path d="M 140 22 C 137 20 137 17 138 15 C 140 12 143 11 144 9 C 145 11 147 13 147 16 C 149 14 150 13 150 11 C 152 14 153 18 150 21 C 148 23 143 23 140 22 Z" fill="#b45309"/>
    <text x="156" y="20" fill="#b45309" font-size="11" font-weight="700">5 Days</text>

    <!-- Language Mode Toggle -->
    <rect x="216" y="0" width="76" height="32" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Globe Path -->
    <circle cx="229" cy="16" r="6" fill="none" stroke="#475569" stroke-width="1.2"/>
    <line x1="223" y1="16" x2="235" y2="16" stroke="#475569" stroke-width="1.2"/>
    <ellipse cx="229" cy="16" rx="2.5" ry="6" fill="none" stroke="#475569" stroke-width="1.2"/>
    <text x="241" y="20" fill="#475569" font-size="11" font-weight="600">Hinglish</text>

    <!-- User Profile Dropdown -->
    <rect x="300" y="0" width="76" height="32" rx="16" fill="#2563eb"/>
    <circle cx="316" cy="16" r="9" fill="#ffffff"/>
    <text x="316" y="19" fill="#2563eb" font-size="9" font-weight="700" text-anchor="middle">AL</text>
    <text x="333" y="20" fill="#ffffff" font-size="11" font-weight="600">Alex</text>
    <path d="M 361 14 L 365 18 L 369 14" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT NAVIGATION RAIL (Width: 72px)                                        -->
  <!-- ========================================================================= -->
  <rect x="0" y="64" width="72" height="686" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Nav Item: Mountain Climb (Active) -->
  <g transform="translate(12, 78)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <!-- Mountain Icon -->
    <path d="M 14 30 L 22 17 L 27 24 L 31 18 L 36 30 Z" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="42" fill="#2563eb" font-size="8" font-weight="700" text-anchor="middle">CLIMB</text>
  </g>

  <!-- Nav Item: Coding Cockpit -->
  <g transform="translate(12, 136)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#ffffff"/>
    <!-- Code / Terminal Icon -->
    <polyline points="18 20 13 25 18 30" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="30 20 35 25 30 30" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="26" y1="18" x2="22" y2="32" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <text x="24" y="42" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle">CODE</text>
  </g>

  <!-- Nav Item: Socratic Coach -->
  <g transform="translate(12, 194)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#ffffff"/>
    <!-- Lightbulb Icon -->
    <path d="M 20 28 L 28 28 M 22 31 L 26 31 M 24 16 A 6 6 0 0 0 18 22 C 18 25 20 26 20 28 L 28 28 C 28 26 30 25 30 22 A 6 6 0 0 0 24 16 Z" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="42" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle">COACH</text>
  </g>

  <!-- Nav Item: Peer Network -->
  <g transform="translate(12, 252)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#ffffff"/>
    <!-- Users Icon -->
    <path d="M 28 31 V 29 A 4 4 0 0 0 24 25 H 18 A 4 4 0 0 0 14 29 V 31" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="21" cy="20" r="3" fill="none" stroke="#64748b" stroke-width="1.8"/>
    <path d="M 33 30 V 29 A 3 3 0 0 0 30 26" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="28" cy="20" r="2.5" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <!-- Green status pulse -->
    <circle cx="38" cy="14" r="3.5" fill="#10b981"/>
    <text x="24" y="42" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle">PEERS</text>
  </g>

  <!-- Nav Item: Mentor Inbox -->
  <g transform="translate(12, 310)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#ffffff"/>
    <!-- Shield Icon -->
    <path d="M 24 33 C 24 33 32 29 32 23 V 18 L 24 15 L 16 18 V 23 C 16 29 24 33 24 33 Z" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="42" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle">MENTOR</text>
  </g>

  <!-- Nav Item: Admin Studio -->
  <g transform="translate(12, 368)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#ffffff"/>
    <!-- Settings / Gear Icon -->
    <circle cx="24" cy="24" r="3" fill="none" stroke="#64748b" stroke-width="1.8"/>
    <path d="M 24 17 V 19 M 24 29 V 31 M 17 24 H 19 M 29 24 H 31 M 19 19 L 20.5 20.5 M 27.5 27.5 L 29 29 M 19 29 L 20.5 27.5 M 27.5 20.5 L 29 19" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
    <text x="24" y="42" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle">ADMIN</text>
  </g>

  <!-- Rail Bottom: Collapse/Expand -->
  <g transform="translate(12, 690)">
    <rect x="0" y="0" width="48" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 20 19 L 16 23 L 20 27 M 28 19 L 32 23 L 28 27" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ========================================================================= -->
  <!-- MAIN WORKSPACE VIEWPORT (Canvas)                                          -->
  <!-- ========================================================================= -->
  <rect x="88" y="80" width="1088" height="615" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>

  <!-- Workspace Subheader Bar -->
  <rect x="88" y="80" width="1088" height="48" rx="14" fill="#f8fafc"/>
  <line x1="88" y1="128" x2="1176" y2="128" stroke="#e2e8f0" stroke-width="1"/>
  <text x="112" y="109" fill="#0f172a" font-size="13" font-weight="700">Workspace: Coding Cockpit</text>
  <line x1="305" y1="97" x2="305" y2="119" stroke="#cbd5e1" stroke-width="1"/>
  <text x="320" y="109" fill="#64748b" font-size="12">50/50 Split View: Story Analogy &amp; In-Browser Java 21 Sandbox</text>

  <!-- Right Window Utility Toggles -->
  <g transform="translate(976, 91)">
    <rect x="0" y="0" width="88" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Expand Icon -->
    <path d="M 12 10 L 16 6 M 16 6 H 13 M 16 6 V 9 M 22 16 L 18 20 M 18 20 H 21 M 18 20 V 17" fill="none" stroke="#475569" stroke-width="1.3" stroke-linecap="round"/>
    <text x="47" y="17" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Expand</text>

    <rect x="96" y="0" width="96" height="26" rx="6" fill="#2563eb"/>
    <polygon points="110 10 117 13.5 110 17" fill="#ffffff"/>
    <text x="150" y="17" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Run Code</text>
  </g>

  <!-- Workspace Content Split Preview -->
  <g transform="translate(112, 144)">
    <!-- Left Pane: Story Reader Outline -->
    <rect x="0" y="0" width="506" height="525" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-dasharray="4 4"/>
    <text x="253" y="245" fill="#64748b" font-size="13" font-weight="600" text-anchor="middle">Text Story Reader &amp; Physical Analogy Pane</text>
    <text x="253" y="268" fill="#94a3b8" font-size="11" text-anchor="middle">Markdown Specification • Physical Vector Diagrams • Method Contracts</text>

    <!-- Right Pane: Monaco Code Editor Outline -->
    <rect x="526" y="0" width="514" height="525" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="783" y="245" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">Monaco Java 21 Code Editor &amp; Test Runner</text>
    <text x="783" y="268" fill="#64748b" font-size="11" text-anchor="middle">Isolated Sandbox Execution • Instant Test Diffs • Zero Distraction</text>
  </g>

  <!-- ========================================================================= -->
  <!-- FOOTER STATUS STRIP (Height: 35px)                                        -->
  <!-- ========================================================================= -->
  <rect x="0" y="715" width="1200" height="35" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(20, 725)">
    <!-- Service Health Lights -->
    <circle cx="6" cy="12" r="4" fill="#10b981"/>
    <text x="16" y="15" fill="#475569" font-size="10" font-weight="600">Kubernetes Cluster: Healthy</text>

    <text x="195" y="15" fill="#cbd5e1">|</text>
    <circle cx="212" cy="12" r="4" fill="#10b981"/>
    <text x="222" y="15" fill="#475569" font-size="10">Redis Session: Active</text>

    <text x="365" y="15" fill="#cbd5e1">|</text>
    <text x="380" y="15" fill="#475569" font-size="10">Sandbox Runner: Standby (0.04s latency)</text>

    <!-- Right Side Help & Shortcuts -->
    <text x="1150" y="15" fill="#64748b" font-size="10" text-anchor="end">Press <tspan font-family="monospace" fill="#0f172a" font-weight="600">Cmd+K</tspan> for Command Palette • <tspan font-family="monospace" fill="#0f172a" font-weight="600">Ctrl+Enter</tspan> to Submit</text>
  </g>
</svg>
