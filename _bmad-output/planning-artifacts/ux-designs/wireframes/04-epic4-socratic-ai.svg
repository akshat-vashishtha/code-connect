<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="drawerShadow" x="-10%" y="-5%" width="120%" height="110%">
      <feDropShadow dx="-4" dy="0" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="#f8fafc"/>

  <!-- ========================================================================= -->
  <!-- BACKGROUND COCKPIT LAYER (Dimmed / Contextual Behind Drawer)               -->
  <!-- ========================================================================= -->
  <rect x="0" y="0" width="1200" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="26" fill="#0f172a" font-size="14" font-weight="700">Coding Cockpit</text>
  <text x="24" y="42" fill="#64748b" font-size="11">Foothold 2.3: Circular Queue Buffer (Java 21)</text>

  <!-- Left 50% Coding Spec (Muted/Context) -->
  <g transform="translate(24, 72)" opacity="0.6">
    <rect x="0" y="0" width="450" height="654" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="450" height="42" rx="8" fill="#f8fafc"/>
    <text x="16" y="26" fill="#0f172a" font-size="13" font-weight="700">Problem Specification &amp; Story Analogy</text>
    
    <rect x="16" y="58" width="418" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="28" y="80" fill="#1e3a8a" font-size="11" font-weight="700">Physical Story: Airport Baggage Carousel</text>
    <text x="28" y="98" fill="#3b82f6" font-size="11">Circular belt continuously wraps from slot N-1 back to 0.</text>
    
    <!-- Code Outline / Problem Specs -->
    <rect x="16" y="130" width="418" height="180" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="28" y="156" fill="#475569" font-size="11" font-family="monospace">public boolean enqueue(int value) {...}</text>
    <text x="28" y="180" fill="#475569" font-size="11" font-family="monospace">public int dequeue() {...}</text>
    <text x="28" y="204" fill="#475569" font-size="11" font-family="monospace">public boolean isFull() {...}</text>
    <text x="28" y="228" fill="#475569" font-size="11" font-family="monospace">public boolean isEmpty() {...}</text>

    <!-- Failed Test Evaluation Pill -->
    <rect x="16" y="326" width="418" height="90" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <line x1="28" y1="344" x2="36" y2="352" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="344" x2="28" y2="352" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    <text x="44" y="350" fill="#991b1b" font-size="12" font-weight="700">Test 3 Failed: IndexOutOfBoundsException</text>
    <text x="28" y="370" fill="#b91c1c" font-size="11">Array index out of range: 5 at CircularQueue.enqueue()</text>
    <text x="28" y="394" fill="#7f1d1d" font-size="10">Wrap-around modulo logic missing or off-by-one</text>
  </g>

  <!-- Center-Right Editor (Dimmed background) -->
  <g transform="translate(490, 72)" opacity="0.45">
    <rect x="0" y="0" width="250" height="654" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="250" height="38" rx="8" fill="#1e293b"/>
    <text x="16" y="24" fill="#94a3b8" font-size="11" font-family="monospace">CircularQueue.java</text>
  </g>

  <!-- Dim overlay backdrop on left area -->
  <rect x="0" y="56" width="750" height="694" fill="#0f172a" opacity="0.25"/>

  <!-- ========================================================================= -->
  <!-- SLIDE-OUT SOCRATIC AI DEBUGGER DRAWER (Width: 450px, Right-Anchored)       -->
  <!-- ========================================================================= -->
  <g transform="translate(750, 0)" filter="url(#drawerShadow)">
    <rect x="0" y="0" width="450" height="750" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Drawer Header (60px) -->
    <rect x="0" y="0" width="450" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <circle cx="28" cy="30" r="14" fill="#eff6ff"/>
    <!-- Lightbulb Vector -->
    <path d="M 25 35 H 31 M 26 37 H 30 M 28 24 A 4.5 4.5 0 0 0 23.5 28.5 C 23.5 30.5 25 31.5 25 33 H 31 C 31 31.5 32.5 30.5 32.5 28.5 A 4.5 4.5 0 0 0 28 24 Z" fill="none" stroke="#2563eb" stroke-width="1.3"/>
    
    <text x="50" y="27" fill="#0f172a" font-size="13" font-weight="700">Socratic AI Story Debugger</text>
    <text x="50" y="44" fill="#059669" font-size="10" font-weight="700">TIER 1 SUPPORT • NON-SPOILER ACTIVE</text>

    <!-- Language Toggle Switch (English / Hinglish) -->
    <g transform="translate(290, 16)">
      <rect x="0" y="0" width="112" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="50" y="2" width="60" height="24" rx="12" fill="#2563eb"/>
      <text x="25" y="18" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">EN</text>
      <text x="80" y="18" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Hinglish</text>
    </g>

    <!-- Close Drawer Button (Vector X) -->
    <g transform="translate(420, 24)">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="10" y1="0" x2="0" y2="10" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Socratic Guardrail Banner -->
    <g transform="translate(16, 72)">
      <rect x="0" y="0" width="418" height="38" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <!-- Shield Vector -->
      <path d="M 22 28 C 22 28 26 25 26 22 V 19 L 22 17.5 L 18 19 V 22 C 18 25 22 28 22 28 Z" fill="none" stroke="#166534" stroke-width="1.3"/>
      <text x="34" y="23" fill="#166534" font-size="10.5" font-weight="600">Strict Socratic Mode: Guiding with mental models &amp; clues.</text>
    </g>

    <!-- Chat Stream / Conversation Thread Area -->
    <g transform="translate(16, 122)">
      <!-- Message 1: Automated Test Failure Trigger -->
      <g transform="translate(0, 0)">
        <rect x="38" y="0" width="380" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <line x1="18" y1="20" x2="26" y2="28" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="26" y1="20" x2="18" y2="28" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
        <text x="50" y="20" fill="#991b1b" font-size="11" font-weight="700">Automated Stack Trace Diagnostic:</text>
        <text x="50" y="38" fill="#475569" font-size="10.5">IndexOutOfBoundsException at line 24: array index 5</text>
      </g>

      <!-- Message 2: Socratic AI Story-Based Clue -->
      <g transform="translate(0, 64)">
        <circle cx="16" cy="16" r="12" fill="#eff6ff"/>
        <!-- Lightbulb Vector -->
        <path d="M 14 20 H 18 M 15 21 H 17 M 16 11 A 3 3 0 0 0 13 14 C 13 15.5 14 16 14 17 H 18 C 18 16 19 15.5 19 14 A 3 3 0 0 0 16 11 Z" fill="none" stroke="#2563eb" stroke-width="1.2"/>
        
        <rect x="38" y="0" width="380" height="152" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="52" y="22" fill="#1e3a8a" font-size="11" font-weight="700">Socratic Guide (Hinglish Analogy):</text>
        <text x="52" y="42" fill="#1e40af" font-size="11">
          "Socho airport ke circular baggage belt ke baare mein!
        </text>
        <text x="52" y="58" fill="#1e40af" font-size="11">
          Agar belt pe total 5 slots hain (0 se 4), aur tumhara
        </text>
        <text x="52" y="74" fill="#1e40af" font-size="11">
          tail pointer slot 4 pe hai, toh agla bag slot 5 pe nahi
        </text>
        <text x="52" y="90" fill="#1e40af" font-size="11">
          ja sakta kyunki array size 5 hai."
        </text>
        <text x="52" y="112" fill="#1e3a8a" font-size="11" font-weight="700">
          Reflective Question for You:
        </text>
        <text x="52" y="130" fill="#1e40af" font-size="11">
          Kaunsa mathematical operator number ko wapas 0 pe le aata hai?
        </text>
      </g>

      <!-- Message 3: Student Response -->
      <g transform="translate(48, 228)">
        <rect x="0" y="0" width="370" height="42" rx="8" fill="#2563eb"/>
        <text x="14" y="26" fill="#ffffff" font-size="11">
          "The modulo operator % ? Lekin condition kya hogi?"
        </text>
      </g>

      <!-- Progressive Hint Tiers Accordion -->
      <g transform="translate(0, 282)">
        <text x="4" y="14" fill="#0f172a" font-size="10.5" font-weight="700" letter-spacing="0.5">PROGRESSIVE HINT TIERS (3 AVAILABLE)</text>

        <!-- Hint 1 (Unlocked) -->
        <g transform="translate(0, 24)">
          <rect x="0" y="0" width="418" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <polyline points="14 17 17 20 22 14" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
          <text x="28" y="22" fill="#059669" font-size="11" font-weight="700">Tier 1 Hint:</text>
          <text x="115" y="22" fill="#475569" font-size="11">Baggage Carousel Analogy</text>
          <rect x="345" y="8" width="60" height="18" rx="9" fill="#f1f5f9"/>
          <text x="375" y="20" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle">VIEWED</text>
        </g>

        <!-- Hint 2 (Unlocked) -->
        <g transform="translate(0, 66)">
          <rect x="0" y="0" width="418" height="50" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
          <circle cx="20" cy="20" r="3" fill="#b45309"/>
          <text x="28" y="22" fill="#b45309" font-size="11" font-weight="700">Tier 2 Hint:</text>
          <text x="115" y="22" fill="#92400e" font-size="11" font-weight="600">Modulo Wrap Formula</text>
          <text x="28" y="39" fill="#78350f" font-size="10">
            Use <tspan font-family="monospace">(tail + 1) % capacity</tspan> before assigning value.
          </text>
        </g>

        <!-- Hint 3 (Locked behind confirmation) -->
        <g transform="translate(0, 124)">
          <rect x="0" y="0" width="418" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3" stroke-width="1"/>
          <!-- Lock Vector -->
          <rect x="14" y="20" width="8" height="6" rx="1" fill="#64748b"/>
          <path d="M 15 20 V 17 C 15 15.5 21 15.5 21 17 V 20" fill="none" stroke="#64748b" stroke-width="1.2"/>
          <text x="28" y="26" fill="#64748b" font-size="11" font-weight="600">Tier 3: Structural Model</text>
          <rect x="300" y="8" width="106" height="26" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
          <text x="353" y="25" fill="#334155" font-size="10" font-weight="700" text-anchor="middle">Unlock Hint 3</text>
        </g>
      </g>
    </g>

    <!-- Quick Prompt Chips -->
    <g transform="translate(16, 580)">
      <text x="0" y="12" fill="#64748b" font-size="10" font-weight="600">RECOMMENDED PROMPTS:</text>
      <rect x="0" y="20" width="170" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <text x="85" y="36" fill="#334155" font-size="9.5" text-anchor="middle">"Explain tail % cap"</text>

      <rect x="178" y="20" width="146" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <text x="251" y="36" fill="#334155" font-size="9.5" text-anchor="middle">"Why is tail == head full?"</text>

      <rect x="332" y="20" width="86" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="375" y="36" fill="#2563eb" font-size="10" font-weight="700" text-anchor="middle">Tier 2 Peers</text>
    </g>

    <!-- Interactive Drawer Input Box (Bottom) -->
    <g transform="translate(16, 642)">
      <rect x="0" y="0" width="418" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="14" y="31" fill="#94a3b8" font-size="11">Ask Socratic AI a conceptual question...</text>
      <!-- Send Button with Arrow Vector -->
      <rect x="368" y="8" width="40" height="36" rx="6" fill="#2563eb"/>
      <path d="M 382 26 L 394 26 M 389 20 L 395 26 L 389 32" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      
      <!-- Tier 2 Escalation Link (Zero Collision) -->
      <text x="0" y="72" fill="#64748b" font-size="10">Need human guidance?</text>
      <text x="125" y="72" fill="#2563eb" font-size="10" font-weight="700">Open Peer Solver Network (Tier 2) →</text>
    </g>
  </g>
</svg>
