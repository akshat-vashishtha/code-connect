<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="#f8fafc"/>

  <!-- ========================================================================= -->
  <!-- TOP CONTEXT BAR                                                           -->
  <!-- ========================================================================= -->
  <rect x="0" y="0" width="1200" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="14" width="28" height="28" rx="6" fill="#059669"/>
  <!-- Users Vector Icon -->
  <path d="M 42 32 V 30 A 3 3 0 0 0 39 27 H 35 A 3 3 0 0 0 32 30 V 32" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="37" cy="23" r="2.5" fill="none" stroke="#ffffff" stroke-width="1.4"/>
  <text x="62" y="26" fill="#0f172a" font-size="14" font-weight="700">Peer Solver Network</text>
  <text x="62" y="42" fill="#64748b" font-size="11">Tier 2 Collaborative Support • Foothold 2.3: Circular Queue Buffer</text>

  <!-- Online Climber Counter -->
  <g transform="translate(940, 12)">
    <rect x="0" y="0" width="236" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#10b981"/>
    <text x="28" y="21" fill="#065f46" font-size="11" font-weight="600">8 Solvers Online • 42 Conquered</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT COLUMN: Verified Peer Solvers Table (Width: 680px)                   -->
  <!-- ========================================================================= -->
  <g transform="translate(24, 76)">
    <rect x="0" y="0" width="680" height="650" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- Table Header Toolbar (Clean 2-Line Layout with Zero Collisions) -->
    <rect x="0" y="0" width="680" height="54" rx="12" fill="#f8fafc"/>
    <line x1="0" y1="54" x2="680" y2="54" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="24" fill="#0f172a" font-size="13" font-weight="700">Available Solvers for Foothold 2.3</text>
    <text x="20" y="42" fill="#64748b" font-size="11">Showing students who passed all tests &amp; are eligible for peer discussion</text>

    <!-- Filter Pills -->
    <g transform="translate(510, 14)">
      <rect x="0" y="0" width="75" height="26" rx="13" fill="#2563eb"/>
      <text x="37" y="17" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">ONLINE</text>
      <rect x="83" y="0" width="75" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="120" y="17" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">ALL (42)</text>
    </g>

    <!-- Table Column Headers with Strict Coordinate Spacing -->
    <g transform="translate(20, 72)">
      <text x="0" y="0" fill="#64748b" font-size="11" font-weight="700">CLIMBER</text>
      <text x="230" y="0" fill="#64748b" font-size="11" font-weight="700">ALTITUDE</text>
      <text x="330" y="0" fill="#64748b" font-size="11" font-weight="700">CONQUERED STRATEGY</text>
      <text x="490" y="0" fill="#64748b" font-size="11" font-weight="700">ACTION</text>
    </g>
    <line x1="20" y1="84" x2="660" y2="84" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Row 1: Rohan Sharma (Active Selected for Chat) -->
    <g transform="translate(20, 96)">
      <rect x="0" y="0" width="640" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <circle cx="26" cy="37" r="16" fill="#2563eb"/>
      <text x="26" y="41" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">RS</text>
      <circle cx="36" cy="47" r="4" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
      
      <text x="52" y="30" fill="#0f172a" font-size="12" font-weight="700">Rohan Sharma</text>
      <text x="52" y="46" fill="#059669" font-size="10" font-weight="600">Active • Solved 2h ago</text>

      <text x="230" y="40" fill="#334155" font-size="12" font-weight="600">1,850m</text>

      <rect x="330" y="24" width="140" height="26" rx="13" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <text x="400" y="41" fill="#1e40af" font-size="10.5" font-weight="600" text-anchor="middle">Explicit Count Buffer</text>

      <!-- Active Chatting Pill -->
      <rect x="490" y="22" width="135" height="30" rx="6" fill="#2563eb"/>
      <text x="557" y="42" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Chatting Now →</text>
    </g>

    <!-- Row 2: Sneha Patel -->
    <g transform="translate(20, 180)">
      <rect x="0" y="0" width="640" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="26" cy="35" r="16" fill="#ec4899"/>
      <text x="26" y="39" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">SP</text>
      <circle cx="36" cy="45" r="4" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>

      <text x="52" y="28" fill="#0f172a" font-size="12" font-weight="700">Sneha Patel</text>
      <text x="52" y="44" fill="#64748b" font-size="10">Available • Solved 1d ago</text>

      <text x="230" y="38" fill="#334155" font-size="12" font-weight="600">2,100m</text>

      <rect x="330" y="22" width="140" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="400" y="39" fill="#475569" font-size="10.5" text-anchor="middle">Modulo Ring Trick</text>

      <rect x="490" y="20" width="135" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="557" y="40" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Request Discussion</text>
    </g>

    <!-- Row 3: Dev K. -->
    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="640" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="26" cy="35" r="16" fill="#f59e0b"/>
      <text x="26" y="39" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">DK</text>
      <circle cx="36" cy="45" r="4" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>

      <text x="52" y="28" fill="#0f172a" font-size="12" font-weight="700">Dev Kumar</text>
      <text x="52" y="44" fill="#64748b" font-size="10">Available • Solved 3d ago</text>

      <text x="230" y="38" fill="#334155" font-size="12" font-weight="600">1,600m</text>

      <rect x="330" y="22" width="140" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="400" y="39" fill="#475569" font-size="10.5" text-anchor="middle">Dummy Sentinel Slot</text>

      <rect x="490" y="20" width="135" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="557" y="40" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Request Discussion</text>
    </g>

    <!-- Collaborative Culture Callout -->
    <g transform="translate(20, 480)">
      <rect x="0" y="0" width="640" height="120" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <circle cx="30" cy="30" r="14" fill="#dcfce7"/>
      <!-- Handshake Vector Path -->
      <path d="M 23 30 L 27 26 C 28 25 30 25 31 26 L 35 30" fill="none" stroke="#166534" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 25 32 L 28 29 M 29 33 L 32 30" stroke="#166534" stroke-width="1.2" stroke-linecap="round"/>

      <text x="56" y="28" fill="#166534" font-size="13" font-weight="700">Peer Solver Honor Code</text>
      <text x="56" y="48" fill="#15803d" font-size="11">
        • You only unlock peer discussions after engaging with Tier 1 Socratic AI hints first.
      </text>
      <text x="56" y="66" fill="#15803d" font-size="11">
        • Discussing conceptual mental models earns peer karma altitude points.
      </text>
      <text x="56" y="84" fill="#15803d" font-size="11">
        • Copy-pasting full code violates academic integrity and triggers mentor review.
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT COLUMN: 1-on-1 Peer Discussion Panel (Width: 460px)                 -->
  <!-- ========================================================================= -->
  <g transform="translate(720, 76)">
    <rect x="0" y="0" width="456" height="650" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- Chat Header -->
    <rect x="0" y="0" width="456" height="60" rx="12" fill="#f8fafc"/>
    <line x1="0" y1="60" x2="456" y2="60" stroke="#e2e8f0" stroke-width="1"/>
    
    <circle cx="28" cy="30" r="16" fill="#2563eb"/>
    <text x="28" y="34" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">RS</text>
    <circle cx="38" cy="40" r="4" fill="#10b981"/>
    
    <text x="52" y="26" fill="#0f172a" font-size="13" font-weight="700">Rohan Sharma</text>
    <text x="52" y="42" fill="#059669" font-size="10" font-weight="600">Altitude 1,850m • Circular Queue Master</text>

    <!-- Share Code Snapshot Toggle -->
    <g transform="translate(320, 18)">
      <rect x="0" y="0" width="120" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <circle cx="14" cy="12" r="4" fill="#2563eb"/>
      <polyline points="98 12 101 15 106 9" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="16" fill="#1e40af" font-size="9.5" font-weight="700">Sync Snippet</text>
    </g>

    <!-- Chat Stream Area -->
    <g transform="translate(16, 76)">
      <!-- System Notification -->
      <rect x="40" y="0" width="340" height="24" rx="12" fill="#f1f5f9"/>
      <text x="210" y="16" fill="#64748b" font-size="10" text-anchor="middle">Connected with Rohan Sharma for Foothold 2.3</text>

      <!-- Message 1 (Rohan) -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="360" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="20" fill="#0f172a" font-size="11" font-weight="600">Rohan:</text>
        <text x="14" y="38" fill="#334155" font-size="11">
          Hey Alex! Are you getting stuck with empty vs full
        </text>
        <text x="14" y="52" fill="#334155" font-size="11">
          condition when head and tail meet?
        </text>
      </g>

      <!-- Message 2 (Alex / User) -->
      <g transform="translate(56, 114)">
        <rect x="0" y="0" width="368" height="60" rx="8" fill="#2563eb"/>
        <text x="14" y="20" fill="#ffffff" font-size="11" font-weight="600">You (Alex):</text>
        <text x="14" y="38" fill="#eff6ff" font-size="11">
          Exactly! When <tspan font-family="monospace">tail == head</tspan>, my code can't tell if
        </text>
        <text x="14" y="52" fill="#eff6ff" font-size="11">
          the buffer has 0 items or is totally full.
        </text>
      </g>

      <!-- Message 3 (Rohan Advice with Code Concept) -->
      <g transform="translate(0, 186)">
        <rect x="0" y="0" width="380" height="106" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="20" fill="#0f172a" font-size="11" font-weight="600">Rohan:</text>
        <text x="14" y="38" fill="#334155" font-size="11">
          Classic trap! You have two choices:
        </text>
        <text x="14" y="56" fill="#334155" font-size="11">
          1. Keep an explicit <tspan font-family="monospace" font-weight="600">count</tspan> variable (increment on enqueue,
        </text>
        <text x="14" y="72" fill="#334155" font-size="11">
          decrement on dequeue).
        </text>
        <text x="14" y="92" fill="#1e40af" font-size="11" font-weight="600">
          Then <tspan font-family="monospace">isEmpty() =&gt; count == 0</tspan> and <tspan font-family="monospace">isFull() =&gt; count == cap</tspan>!
        </text>
      </g>

      <!-- Shared Code Snapshot Card (Alex's Snippet) -->
      <g transform="translate(0, 304)">
        <rect x="0" y="0" width="424" height="100" rx="8" fill="#0f172a"/>
        <rect x="0" y="0" width="424" height="26" rx="8" fill="#1e293b"/>
        <text x="12" y="17" fill="#94a3b8" font-size="10" font-family="monospace">Alex's Shared Snippet (CircularQueue.java:24)</text>
        
        <text x="12" y="44" fill="#f8fafc" font-size="11" font-family="monospace">// Rohan suggested adding this count state:</text>
        <text x="12" y="62" fill="#38bdf8" font-size="11" font-family="monospace">private int count = 0;</text>
        <text x="12" y="80" fill="#4ade80" font-size="11" font-family="monospace">public boolean isFull() { return count == capacity; }</text>
      </g>
    </g>

    <!-- Chat Input Toolbar (Bottom) -->
    <g transform="translate(16, 560)">
      <rect x="0" y="0" width="424" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="14" y="28" fill="#94a3b8" font-size="11">Reply to Rohan (or paste snippet)...</text>
      <!-- Send Button with Vector Arrow -->
      <rect x="374" y="6" width="42" height="34" rx="6" fill="#2563eb"/>
      <polygon points="390 18 402 23 390 28" fill="#ffffff"/>

      <!-- Escalate to Tier 3 Mentor Action Link -->
      <g transform="translate(0, 56)">
        <text x="0" y="14" fill="#64748b" font-size="10">Still unverified or stuck?</text>
        <text x="170" y="14" fill="#b45309" font-size="10" font-weight="700">Escalate to Staff Mentor (Tier 3) →</text>
      </g>
    </g>
  </g>
</svg>
