<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="#f8fafc"/>

  <!-- ========================================================================= -->
  <!-- TOP CONTEXT BAR                                                           -->
  <!-- ========================================================================= -->
  <rect x="0" y="0" width="1200" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="14" width="28" height="28" rx="6" fill="#2563eb"/>
  <text x="38" y="33" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">CC</text>
  <text x="62" y="26" fill="#0f172a" font-size="14" font-weight="700">Mountain Ascent Dashboard</text>
  <text x="62" y="42" fill="#64748b" font-size="11">Epic 7: Topographic Progression, Altitude Milestones &amp; Load-Bearing Retention</text>

  <!-- User Profile Quick Chip -->
  <g transform="translate(1000, 12)">
    <rect x="0" y="0" width="176" height="32" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <circle cx="16" cy="16" r="10" fill="#2563eb"/>
    <text x="16" y="20" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">AL</text>
    <text x="32" y="21" fill="#1e40af" font-size="11" font-weight="600">Alex • Climber Rank 2</text>
  </g>

  <!-- ========================================================================= -->
  <!-- TOP ROW: KEY ASCENT METRICS CARDS (Height: 90px)                          -->
  <!-- ========================================================================= -->
  <g transform="translate(24, 72)">
    <!-- Metric 1: Current Altitude -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="270" height="88" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="36" cy="44" r="18" fill="#eff6ff"/>
      <!-- Mountain Vector -->
      <path d="M 28 50 L 34 39 L 38 45 L 41 40 L 44 50 Z" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="34" fill="#64748b" font-size="10.5" font-weight="600">CURRENT ALTITUDE</text>
      <text x="66" y="58" fill="#0f172a" font-size="20" font-weight="800">1,420m <tspan fill="#64748b" font-size="12" font-weight="400">/ 4,000m</tspan></text>
      <text x="66" y="74" fill="#2563eb" font-size="10" font-weight="600">35.5% to the Summit</text>
    </g>

    <!-- Metric 2: Footholds Conquered -->
    <g transform="translate(294, 0)">
      <rect x="0" y="0" width="270" height="88" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="36" cy="44" r="18" fill="#ecfdf5"/>
      <!-- Target / Check Vector -->
      <circle cx="36" cy="44" r="8" fill="none" stroke="#059669" stroke-width="1.4"/>
      <circle cx="36" cy="44" r="3" fill="#059669"/>
      <text x="66" y="34" fill="#64748b" font-size="10.5" font-weight="600">FOOTHOLDS CONQUERED</text>
      <text x="66" y="58" fill="#0f172a" font-size="20" font-weight="800">9 <tspan fill="#64748b" font-size="12" font-weight="400">/ 20 Total</tspan></text>
      <text x="66" y="74" fill="#059669" font-size="10" font-weight="600">Track 2: 4/5 Conquered</text>
    </g>

    <!-- Metric 3: Active Streak -->
    <g transform="translate(588, 0)">
      <rect x="0" y="0" width="270" height="88" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="36" cy="44" r="18" fill="#fffbeb"/>
      <!-- Flame Vector -->
      <path d="M 32 50 C 30 48 30 45 31 43 C 33 40 36 39 37 37 C 38 39 40 41 40 44 C 42 42 43 41 43 39 C 45 42 46 46 43 49 C 41 51 36 51 32 50 Z" fill="#b45309"/>
      <text x="66" y="34" fill="#64748b" font-size="10.5" font-weight="600">ASCENT STREAK</text>
      <text x="66" y="58" fill="#0f172a" font-size="20" font-weight="800">5 Days</text>
      <text x="66" y="74" fill="#b45309" font-size="10" font-weight="600">Top 10% Consistency</text>
    </g>

    <!-- Metric 4: Retention Index -->
    <g transform="translate(882, 0)">
      <rect x="0" y="0" width="270" height="88" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="36" cy="44" r="18" fill="#f5f3ff"/>
      <!-- Shield Vector -->
      <path d="M 36 51 C 36 51 42 48 42 43 V 38 L 36 36 L 30 38 V 43 C 30 48 36 51 36 51 Z" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="34" fill="#64748b" font-size="10.5" font-weight="600">LOAD-BEARING RETENTION</text>
      <text x="66" y="58" fill="#0f172a" font-size="20" font-weight="800">100%</text>
      <text x="66" y="74" fill="#7c3aed" font-size="10" font-weight="600">Verified at Track Transitions</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- MAIN ELEVATION MAP & PROGRESSION PATH (Height: 540px)                     -->
  <!-- ========================================================================= -->
  <g transform="translate(24, 180)">
    <rect x="0" y="0" width="700" height="540" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- Map Header -->
    <rect x="0" y="0" width="700" height="48" rx="12" fill="#f8fafc"/>
    <line x1="0" y1="48" x2="700" y2="48" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="30" fill="#0f172a" font-size="13" font-weight="700">Topographic Ascent Elevation Map</text>
    <text x="280" y="30" fill="#64748b" font-size="11">Follow the 4 load-bearing camps to summit</text>

    <!-- Stylized Mountain Ridgeline Graphic -->
    <g transform="translate(40, 70)">
      <!-- Mountain Background Silhouette -->
      <path d="M 0 420 L 140 320 L 280 220 L 440 120 L 580 40 L 620 420 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      
      <!-- Climbed Ridge Path Line (Green / Completed) -->
      <path d="M 40 390 L 160 300 L 270 210" stroke="#059669" stroke-width="4" stroke-linecap="round" fill="none"/>
      <!-- Active Segment Line (Blue Pulse) -->
      <path d="M 270 210 L 330 170" stroke="#2563eb" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round" fill="none"/>
      <!-- Locked Segments Path (Muted Gray) -->
      <path d="M 330 170 L 440 110 L 570 40" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round" fill="none"/>

      <!-- Waypoint 0: Base Camp (0m) -->
      <g transform="translate(40, 390)">
        <circle cx="0" cy="0" r="14" fill="#059669"/>
        <polyline points="-4 0 -1 3 4 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <rect x="-60" y="18" width="120" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="0" y="35" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">Base Camp (0m)</text>
      </g>

      <!-- Waypoint 1: Foothill Camp 1 (Java Models, 500m) - Conquered -->
      <g transform="translate(160, 300)">
        <circle cx="0" cy="0" r="16" fill="#059669"/>
        <polyline points="-5 0 -2 3 5 -4" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
        <rect x="-70" y="-45" width="140" height="34" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="0" y="-30" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">Camp 1: Java Models</text>
        <text x="0" y="-16" fill="#059669" font-size="9" text-anchor="middle">500m • 5/5 Footholds</text>
      </g>

      <!-- Waypoint 2: Camp 2 (Data Structures, 1,500m) - ACTIVE POSITION -->
      <g transform="translate(310, 180)">
        <!-- Pulsing radar ring -->
        <circle cx="0" cy="0" r="26" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
        <circle cx="0" cy="0" r="18" fill="#2563eb"/>
        <!-- Compass Vector -->
        <circle cx="0" cy="0" r="7" fill="none" stroke="#ffffff" stroke-width="1.5"/>
        <polygon points="2 -2 -1 2 1 2" fill="#ffffff"/>
        
        <!-- Active Climber Tag -->
        <rect x="-85" y="-55" width="170" height="42" rx="8" fill="#1e293b"/>
        <text x="0" y="-38" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">YOU ARE HERE (1,420m)</text>
        <text x="0" y="-22" fill="#93c5fd" font-size="10" text-anchor="middle">Foothold 2.3: Circular Queue</text>
      </g>

      <!-- Waypoint 3: High Camp 3 (Concurrency, 2,800m) - LOCKED -->
      <g transform="translate(440, 110)">
        <circle cx="0" cy="0" r="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
        <!-- Lock Vector -->
        <rect x="-4" y="-2" width="8" height="6" rx="1" fill="#64748b"/>
        <path d="M -3 -2 V -5 C -3 -6.5 3 -6.5 3 -5 V -2" fill="none" stroke="#64748b" stroke-width="1.2"/>
        <rect x="-70" y="-45" width="140" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="0" y="-30" fill="#475569" font-size="11" font-weight="700" text-anchor="middle">Camp 3: Concurrency</text>
        <text x="0" y="-16" fill="#94a3b8" font-size="9" text-anchor="middle">2,800m • Requires Checkpoint</text>
      </g>

      <!-- Waypoint 4: The Summit (4,000m) - LOCKED -->
      <g transform="translate(570, 40)">
        <circle cx="0" cy="0" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
        <!-- Flag Vector -->
        <line x1="-3" y1="8" x2="-3" y2="-8" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <polygon points="-3 -8 6 -4 -3 0" fill="#2563eb"/>
        
        <rect x="-75" y="16" width="150" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="0" y="31" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">THE SUMMIT (4,000m)</text>
        <text x="0" y="44" fill="#64748b" font-size="9" text-anchor="middle">Distributed Microservices</text>
      </g>
    </g>

    <!-- Bottom Action Row inside map -->
    <g transform="translate(20, 480)">
      <rect x="0" y="0" width="660" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="16" y="26" fill="#1e40af" font-size="11.5" font-weight="600">
        Next Objective: Master Foothold 2.4 (Priority Queue) to reach Camp 2.
      </text>
      <rect x="520" y="7" width="125" height="28" rx="6" fill="#2563eb"/>
      <text x="582" y="25" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Resume Cockpit →</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT COLUMN: LOAD-BEARING VERIFICATION MODAL / CARD (Width: 436px)       -->
  <!-- ========================================================================= -->
  <g transform="translate(740, 180)">
    <rect x="0" y="0" width="436" height="540" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#modalShadow)"/>

    <!-- Verification Card Header -->
    <rect x="0" y="0" width="436" height="60" rx="12" fill="#0f172a"/>
    <rect x="0" y="44" width="436" height="16" fill="#0f172a"/>
    <circle cx="30" cy="30" r="14" fill="#1e293b"/>
    <!-- Balance Scale Vector -->
    <line x1="24" y1="26" x2="36" y2="26" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="30" y1="24" x2="30" y2="36" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="22 30 26 30 24 33" fill="#38bdf8"/>
    <polygon points="34 30 38 30 36 33" fill="#38bdf8"/>
    
    <text x="54" y="27" fill="#ffffff" font-size="13" font-weight="700">Load-Bearing Checkpoint</text>
    <text x="54" y="44" fill="#38bdf8" font-size="9.5" font-weight="700">PREREQUISITE VERIFICATION • TRACK 2 TO TRACK 3</text>

    <!-- Modal Explanatory Callout with Vector Warning -->
    <g transform="translate(16, 76)">
      <rect x="0" y="0" width="404" height="56" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <path d="M 20 22 L 15 31 H 25 L 20 22 Z" fill="none" stroke="#b45309" stroke-width="1.3" stroke-linejoin="round"/>
      <line x1="20" y1="25" x2="20" y2="27" stroke="#b45309" stroke-width="1.3" stroke-linecap="round"/>
      
      <text x="32" y="20" fill="#92400e" font-size="11" font-weight="700">Foundational Verification Required:</text>
      <text x="32" y="36" fill="#b45309" font-size="10.5">
        Before ascending to Concurrency &amp; Virtual Threads, verify
      </text>
      <text x="32" y="50" fill="#b45309" font-size="10.5">
        deep conceptual retention with this rapid challenge.
      </text>
    </g>

    <!-- Interactive Challenge Section -->
    <g transform="translate(16, 148)">
      <text x="0" y="14" fill="#0f172a" font-size="12" font-weight="700">
        Challenge 1/1: Memory &amp; Pipeline Safety
      </text>

      <!-- Question Text Block -->
      <rect x="0" y="24" width="404" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="44" fill="#334155" font-size="11" font-weight="600">
        In a high-throughput Java payment service, why does an
      </text>
      <text x="14" y="60" fill="#334155" font-size="11" font-weight="600">
        <tspan fill="#2563eb">unbounded queue</tspan> risk sudden <tspan fill="#dc2626">OutOfMemoryError</tspan> under backpressure?
      </text>

      <!-- Option A -->
      <g transform="translate(0, 100)">
        <rect x="0" y="0" width="404" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <circle cx="20" cy="21" r="7" stroke="#94a3b8" stroke-width="1.5" fill="#ffffff"/>
        <text x="36" y="25" fill="#475569" font-size="11">A. The GC cannot collect thread handles.</text>
      </g>

      <!-- Option B (Correct) -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="404" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <circle cx="20" cy="26" r="7" fill="#2563eb"/>
        <circle cx="20" cy="26" r="3" fill="#ffffff"/>
        <text x="36" y="22" fill="#1e3a8a" font-size="11" font-weight="700">B. Producers outpace consumers, accumulating</text>
        <text x="36" y="38" fill="#1e3a8a" font-size="11" font-weight="700">millions of heap references indefinitely.</text>
      </g>

      <!-- Option C -->
      <g transform="translate(0, 210)">
        <rect x="0" y="0" width="404" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <circle cx="20" cy="21" r="7" stroke="#94a3b8" stroke-width="1.5" fill="#ffffff"/>
        <text x="36" y="25" fill="#475569" font-size="11">C. Stack frames exceed the 1MB thread limit.</text>
      </g>

      <!-- Explanation Clue with Vector Checkmark -->
      <g transform="translate(0, 262)">
        <rect x="0" y="0" width="404" height="44" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <polyline points="14 18 17 21 22 15" fill="none" stroke="#166534" stroke-width="1.5" stroke-linecap="round"/>
        <text x="28" y="18" fill="#166534" font-size="10" font-weight="700">Story Connection:</text>
        <text x="14" y="32" fill="#15803d" font-size="10">
          Remember the conveyor belt: Without a bound, luggage piles to the ceiling!
        </text>
      </g>
    </g>

    <!-- Bottom Checkpoint Action -->
    <g transform="translate(16, 470)">
      <rect x="0" y="0" width="404" height="44" rx="8" fill="#059669"/>
      <text x="202" y="27" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">
        Verify Retention &amp; Unlock Track 3 →
      </text>
    </g>
  </g>
</svg>
