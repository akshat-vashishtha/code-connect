<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="brandHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="#f8fafc"/>

  <!-- ========================================================================= -->
  <!-- TOP CONTEXT BAR                                                           -->
  <!-- ========================================================================= -->
  <rect x="0" y="0" width="1200" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="14" width="28" height="28" rx="6" fill="#2563eb"/>
  <text x="38" y="33" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">CC</text>
  <text x="62" y="26" fill="#0f172a" font-size="14" font-weight="700">Code<tspan fill="#2563eb">Connect</tspan></text>
  <text x="62" y="42" fill="#64748b" font-size="11">Epic 1: Authentication &amp; Role-Governed Onboarding</text>

  <g transform="translate(980, 12)">
    <rect x="0" y="0" width="196" height="32" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="21" fill="#475569" font-size="11" font-weight="600">Environment: <tspan fill="#2563eb">http://localhost/</tspan></text>
  </g>

  <!-- ========================================================================= -->
  <!-- MAIN CONTAINER: SPLIT AUTHENTICATION CARD (Width: 1140px, Height: 620px)  -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="1140" height="620" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- ======================================================================= -->
    <!-- LEFT PANEL: The Solo Mountain Climb Value Narrative (Width: 460px)       -->
    <!-- ======================================================================= -->
    <rect x="0" y="0" width="460" height="620" rx="16" fill="url(#brandHeroGrad)"/>
    <rect x="444" y="0" width="16" height="620" fill="url(#brandHeroGrad)"/>

    <!-- Subtle mountain topo background vectors -->
    <path d="M 0 520 L 120 420 L 220 480 L 320 380 L 460 460 L 460 620 L 0 620 Z" fill="#1e293b" opacity="0.6"/>
    <path d="M 0 570 L 160 490 L 280 540 L 380 470 L 460 510 L 460 620 L 0 620 Z" fill="#334155" opacity="0.4"/>

    <!-- Left Content -->
    <g transform="translate(44, 40)">
      <!-- Altitude Badge with Vector Mountain -->
      <rect x="0" y="0" width="156" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <path d="M 12 18 L 17 10 L 21 15 L 24 11 L 27 18 Z" fill="none" stroke="#93c5fd" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="17" fill="#93c5fd" font-size="10" font-weight="700" letter-spacing="0.5">THE SOLO ASCENT</text>

      <!-- Headline -->
      <text x="0" y="62" fill="#ffffff" font-size="24" font-weight="800">Master Core Engineering.</text>
      <text x="0" y="92" fill="#38bdf8" font-size="24" font-weight="800">No Hand-Waving.</text>

      <text x="0" y="126" fill="#94a3b8" font-size="12" font-weight="400">
        CodeConnect is a load-bearing learning cockpit. Experience
      </text>
      <text x="0" y="144" fill="#94a3b8" font-size="12" font-weight="400">
        real-world architectural stories, write production Java 21,
      </text>
      <text x="0" y="162" fill="#94a3b8" font-size="12" font-weight="400">
        and conquer verified mountain footholds.
      </text>

      <!-- 3-Tier Support Architecture Callout -->
      <g transform="translate(0, 196)">
        <text x="0" y="0" fill="#cbd5e1" font-size="10" font-weight="700" letter-spacing="0.5">3-TIER RESOLUTION ECOSYSTEM</text>

        <!-- Tier 1: Socratic AI -->
        <g transform="translate(0, 14)">
          <rect x="0" y="0" width="372" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <circle cx="26" cy="26" r="12" fill="#2563eb" opacity="0.3"/>
          <!-- Lightbulb Vector -->
          <path d="M 23 29 H 29 M 24 31 H 28 M 26 20 A 4 4 0 0 0 22 24 C 22 26 23 27 23 29 H 29 C 29 27 30 26 30 24 A 4 4 0 0 0 26 20 Z" fill="none" stroke="#60a5fa" stroke-width="1.3"/>
          <text x="50" y="22" fill="#f8fafc" font-size="11" font-weight="700">Tier 1: Socratic AI Story Debugger</text>
          <text x="50" y="38" fill="#94a3b8" font-size="10">Conceptual real-world analogies, zero spoilers.</text>
        </g>

        <!-- Tier 2: Peer Network -->
        <g transform="translate(0, 74)">
          <rect x="0" y="0" width="372" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <circle cx="26" cy="26" r="12" fill="#10b981" opacity="0.3"/>
          <!-- Users Vector -->
          <path d="M 29 30 V 28 A 3 3 0 0 0 26 25 H 22 A 3 3 0 0 0 19 28 V 30" fill="none" stroke="#34d399" stroke-width="1.3"/>
          <circle cx="24" cy="22" r="2.5" fill="none" stroke="#34d399" stroke-width="1.3"/>
          <text x="50" y="22" fill="#f8fafc" font-size="11" font-weight="700">Tier 2: Peer Solver Network</text>
          <text x="50" y="38" fill="#94a3b8" font-size="10">1-on-1 collaborative chat with peers who conquered it.</text>
        </g>

        <!-- Tier 3: Mentor -->
        <g transform="translate(0, 134)">
          <rect x="0" y="0" width="372" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <circle cx="26" cy="26" r="12" fill="#f59e0b" opacity="0.3"/>
          <!-- Shield Vector -->
          <path d="M 26 31 C 26 31 31 28 31 24 V 20 L 26 18 L 21 20 V 24 C 21 28 26 31 26 31 Z" fill="none" stroke="#fbbf24" stroke-width="1.3"/>
          <text x="50" y="22" fill="#f8fafc" font-size="11" font-weight="700">Tier 3: Verified Mentor Escalations</text>
          <text x="50" y="38" fill="#94a3b8" font-size="10">Deep code-level review by industry staff engineers.</text>
        </g>
      </g>

      <!-- Bottom Compliance Note -->
      <g transform="translate(0, 440)">
        <text x="0" y="14" fill="#64748b" font-size="11">Enterprise Clean Architecture • Spring Boot 3.3 • Java 21</text>
        <text x="0" y="30" fill="#475569" font-size="10">Stateful/Stateless Security • RFC 7807 Problem Details</text>
      </g>
    </g>

    <!-- ======================================================================= -->
    <!-- RIGHT PANEL: Interactive Registration / Sign-in Form (Width: 680px)      -->
    <!-- ======================================================================= -->
    <g transform="translate(500, 32)">
      <!-- Tab Header (Sign In vs Create Account) -->
      <rect x="0" y="0" width="600" height="40" rx="8" fill="#f1f5f9"/>
      <rect x="4" y="4" width="294" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="151" y="25" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Create Account</text>
      
      <rect x="302" y="4" width="294" height="32" rx="6" fill="transparent"/>
      <text x="449" y="25" fill="#64748b" font-size="13" font-weight="600" text-anchor="middle">Sign In</text>

      <!-- Role Selection Segment -->
      <g transform="translate(0, 58)">
        <text x="0" y="12" fill="#0f172a" font-size="12" font-weight="700">Select Your Ascent Role <tspan fill="#ef4444">*</tspan></text>
        
        <!-- Role 1: Student (Active Selected) -->
        <g transform="translate(0, 22)">
          <rect x="0" y="0" width="290" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
          <circle cx="26" cy="26" r="12" fill="#dbeafe"/>
          <!-- Student / Compass Vector -->
          <circle cx="26" cy="26" r="6" fill="none" stroke="#2563eb" stroke-width="1.4"/>
          <polygon points="28 24 25 28 27 28" fill="#2563eb"/>
          <text x="48" y="25" fill="#1e3a8a" font-size="12" font-weight="700">Climber / Student</text>
          <text x="48" y="42" fill="#3b82f6" font-size="10">Solo ascent, interactive cockpit,</text>
          <text x="48" y="56" fill="#3b82f6" font-size="10">Socratic AI &amp; peer network access.</text>
          
          <!-- Radio Selected Circle -->
          <circle cx="268" cy="22" r="8" fill="#2563eb"/>
          <polyline points="264 22 267 25 272 19" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Role 2: Mentor (Unselected) -->
        <g transform="translate(310, 22)">
          <rect x="0" y="0" width="290" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <circle cx="26" cy="26" r="12" fill="#f1f5f9"/>
          <!-- Shield Vector -->
          <path d="M 26 31 C 26 31 31 28 31 24 V 20 L 26 18 L 21 20 V 24 C 21 28 26 31 26 31 Z" fill="none" stroke="#64748b" stroke-width="1.3"/>
          <text x="48" y="25" fill="#334155" font-size="12" font-weight="700">Technical Mentor</text>
          <text x="48" y="42" fill="#64748b" font-size="10">Resolve Tier 3 escalations,</text>
          <text x="48" y="56" fill="#64748b" font-size="10">author footholds &amp; guide learners.</text>
          <circle cx="268" cy="22" r="8" stroke="#cbd5e1" stroke-width="1.5" fill="#ffffff"/>
        </g>
      </g>

      <!-- Input Fields -->
      <g transform="translate(0, 172)">
        <!-- Full Name -->
        <g transform="translate(0, 0)">
          <text x="0" y="12" fill="#334155" font-size="11" font-weight="600">Full Name</text>
          <rect x="0" y="18" width="600" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="14" y="41" fill="#0f172a" font-size="12">Alex Vashishtha</text>
        </g>

        <!-- Email -->
        <g transform="translate(0, 68)">
          <text x="0" y="12" fill="#334155" font-size="11" font-weight="600">Email Address</text>
          <rect x="0" y="18" width="600" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="14" y="41" fill="#0f172a" font-size="12">alex@codeconnect.dev</text>
          <!-- Validated Checkmark Icon -->
          <circle cx="574" cy="36" r="8" fill="#ecfdf5"/>
          <polyline points="570 36 573 39 578 33" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Password -->
        <g transform="translate(0, 136)">
          <text x="0" y="12" fill="#334155" font-size="11" font-weight="600">Password (Min 8 chars, 1 uppercase, 1 symbol)</text>
          <rect x="0" y="18" width="600" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <text x="14" y="41" fill="#0f172a" font-size="13">••••••••••••</text>
          <!-- Password strength indicator -->
          <g transform="translate(480, 34)">
            <rect x="0" y="0" width="24" height="4" rx="2" fill="#10b981"/>
            <rect x="28" y="0" width="24" height="4" rx="2" fill="#10b981"/>
            <rect x="56" y="0" width="24" height="4" rx="2" fill="#10b981"/>
            <rect x="84" y="0" width="24" height="4" rx="2" fill="#10b981"/>
          </g>
        </g>
      </g>

      <!-- Terms & Consent -->
      <g transform="translate(0, 388)">
        <rect x="0" y="0" width="16" height="16" rx="4" fill="#2563eb"/>
        <polyline points="4 8 7 11 12 5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="13" fill="#64748b" font-size="11">I accept the <tspan fill="#2563eb" font-weight="600">Code of Honor</tspan> (Zero Plagiarism, Pure Conceptual Understanding)</text>
      </g>

      <!-- Submit Action Button -->
      <g transform="translate(0, 420)">
        <rect x="0" y="0" width="600" height="42" rx="8" fill="#2563eb"/>
        <text x="300" y="26" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Begin Mountain Ascent →</text>
      </g>

      <!-- Pending Approval Harmonization Banner -->
      <g transform="translate(0, 480)">
        <rect x="0" y="0" width="600" height="58" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <!-- Vector Alert Triangle (Centered) -->
        <path d="M 20 18 L 12 32 H 28 L 20 18 Z" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
        <line x1="20" y1="23" x2="20" y2="27" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="20" cy="29.5" r="0.75" fill="#b45309"/>

        <text x="36" y="22" fill="#92400e" font-size="11" font-weight="700">Notice for Technical Mentors:</text>
        <text x="36" y="37" fill="#b45309" font-size="10">Mentor sign-ups redirect automatically to <tspan font-family="monospace" font-weight="600">/pending-approval</tspan></text>
        <text x="36" y="50" fill="#b45309" font-size="10">until verified and activated by Admin Studio governance.</text>
      </g>
    </g>
  </g>
</svg>
