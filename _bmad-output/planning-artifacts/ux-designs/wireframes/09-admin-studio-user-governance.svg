  <path d="M 38 22 V 24 M 38 32 V 34 M 32 28 H 34 M 42 28 H 44 M 34 24 L 35.5 25.5 M 40.5 30.5 L 42 32 M 34 32 L 35.5 30.5 M 40.5 25.5 L 42 24" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

