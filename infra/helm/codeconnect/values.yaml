# Default values for codeconnect umbrella chart.

global:
  environment: local

# Stateful Infrastructure: MongoDB Community
mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent
  port: 27017
  database: codeconnect_db
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Stateful Infrastructure: Redis (Distributed Sessions)
redis:
  enabled: true
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  port: 6379
  persistence:
    enabled: true
    size: 512Mi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Edge Gateway Service (Spring Cloud Gateway 4.1 / Spring Boot 3.3)
gateway:
  replicaCount: 1
  image:
    repository: codeconnect/gateway-service
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 384Mi
  probes:
    startup:
      path: /actuator/health/liveness
      failureThreshold: 30
      periodSeconds: 3
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 5
      periodSeconds: 5

# User Microservice (Spring Boot 3.3 / MongoDB & Redis)
userService:
  replicaCount: 1
  image:
    repository: codeconnect/user-service
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 384Mi
  probes:
    startup:
      path: /actuator/health/liveness
      failureThreshold: 30
      periodSeconds: 3
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 5
      periodSeconds: 5

# Next.js 15 Frontend
frontend:
  replicaCount: 1
  image:
    repository: codeconnect/frontend
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  probes:
    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 5

# Ingress Controller (Traefik in k3d / k3s)
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
