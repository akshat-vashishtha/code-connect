server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: curriculum-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/codeconnect_db}
      auto-index-creation: true

codeconnect:
  curriculum:
    default-language: ${DEFAULT_LANGUAGE:ENGLISH}
    max-lessons-per-module: ${MAX_LESSONS_PER_MODULE:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    probes:
      enabled: true
