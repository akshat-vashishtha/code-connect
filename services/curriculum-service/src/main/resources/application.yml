server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: curriculum-service
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/codeconnect_db}
      auto-index-creation: true

codeconnect:
  curriculum:
    default-language: ${DEFAULT_LANGUAGE:ENGLISH}
    max-lessons-per-module: ${MAX_LESSONS_PER_MODULE:50}
  security:
    internal-secret: ${INTERNAL_SECURITY_SECRET:c0d3c0nn3ct-1nt3rn4l-s3cur1ty-h256-s3cr3t-k3y-m1n32byt3s!}
    max-clock-skew-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      access: read_only
  health:
    probes:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
