server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true
  cache:
    type: ${CACHE_TYPE:redis}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/codeconnect_db}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_COMMAND_TIMEOUT_MS:1500}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:2000}
      client-name: user-service
      lettuce:
        pool:
          min-idle: ${REDIS_POOL_MIN_IDLE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          max-active: ${REDIS_POOL_MAX_ACTIVE:32}
          max-wait: ${REDIS_POOL_MAX_WAIT_MS:1500}
          time-between-eviction-runs: ${REDIS_POOL_EVICTION_MS:30000}
  session:
    store-type: redis
    redis:
      namespace: spring:session
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 2147483647
      batch-size: 16384
      buffer-memory: 33554432
      compression-type: snappy
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 180000
        request.timeout.ms: 120000
        max.block.ms: 60000
        linger.ms: 10
        spring.json.add.type.headers: true

codeconnect:
  kafka:
    env: ${KAFKA_ENV:dev}
    topics:
      mentor-application-approved: ${codeconnect.kafka.env}.codeconnect.user.mentor-application.approved.v1
      mentor-application-rejected: ${codeconnect.kafka.env}.codeconnect.user.mentor-application.rejected.v1
      user-registered: ${codeconnect.kafka.env}.codeconnect.user.registered.v1
  cache:
    ttl:
      default-ttl-ms: ${CACHE_DEFAULT_TTL_MS:900000}
      users-ttl-ms: ${CACHE_USERS_TTL_MS:900000}
      mentors-ttl-ms: ${CACHE_MENTORS_TTL_MS:300000}
  redis:
    min-idle: ${REDIS_POOL_MIN_IDLE:8}
    max-idle: ${REDIS_POOL_MAX_IDLE:16}
    max-active: ${REDIS_POOL_MAX_ACTIVE:32}
    max-wait-ms: ${REDIS_POOL_MAX_WAIT_MS:1500}
    connect-timeout-ms: ${REDIS_CONNECT_TIMEOUT_MS:2000}
    command-timeout-ms: ${REDIS_COMMAND_TIMEOUT_MS:1500}
    keep-alive: true
    tcp-no-delay: true
  mongodb:
    min-pool-size: ${MONGO_MIN_POOL_SIZE:10}
    max-pool-size: ${MONGO_MAX_POOL_SIZE:100}
    max-wait-time-ms: ${MONGO_MAX_WAIT_TIME_MS:3000}
    max-idle-time-ms: ${MONGO_MAX_IDLE_TIME_MS:60000}
    max-life-time-ms: ${MONGO_MAX_LIFE_TIME_MS:1800000}
    maintenance-frequency-ms: ${MONGO_MAINTENANCE_MS:10000}
    connect-timeout-ms: ${MONGO_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${MONGO_READ_TIMEOUT_MS:5000}
    server-selection-timeout-ms: ${MONGO_SERVER_SELECTION_TIMEOUT_MS:3000}
    compressors: ${MONGO_COMPRESSORS:snappy,zstd}
    write-concern: ${MONGO_WRITE_CONCERN:majority}
    read-preference: ${MONGO_READ_PREFERENCE:primaryPreferred}
  security:
    internal-secret: ${INTERNAL_SECURITY_SECRET:c0d3c0nn3ct-1nt3rn4l-s3cur1ty-h256-s3cr3t-k3y-m1n32byt3s!}
    max-clock-skew-seconds: ${MAX_CLOCK_SKEW_SECONDS:30}
  user:
    default-reviewer: ${DEFAULT_REVIEWER:SYSTEM}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      access: read_only
  health:
    probes:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
