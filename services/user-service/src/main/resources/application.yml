server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/codeconnect_db}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    store-type: redis
    redis:
      namespace: spring:session

codeconnect:
  security:
    internal-secret: ${INTERNAL_SECURITY_SECRET:default-dev-internal-secret-change-in-production-32bytes!}
    max-clock-skew-seconds: ${MAX_CLOCK_SKEW_SECONDS:30}
  user:
    default-reviewer: ${DEFAULT_REVIEWER:SYSTEM}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    probes:
      enabled: true
