server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_COMMAND_TIMEOUT_MS:1500}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:2000}
      client-name: gateway-service
      lettuce:
        pool:
          min-idle: ${REDIS_POOL_MIN_IDLE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:32}
          max-active: ${REDIS_POOL_MAX_ACTIVE:64}
          max-wait: ${REDIS_POOL_MAX_WAIT_MS:1500}
          time-between-eviction-runs: ${REDIS_POOL_EVICTION_MS:30000}
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:7d}
    redis:
      namespace: spring:session
  cloud:
    gateway:
      routes:
        # User Service Routes (Port 8081)
        - id: admin-service-route
          uri: ${USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        - id: mentor-service-route
          uri: ${USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/mentor/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        - id: user-service-route
          uri: ${USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        # Curriculum Service Routes (Port 8082)
        - id: admin-curriculum-service-route
          order: -1
          uri: ${CURRICULUM_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/curriculum/**
          filters:
            - name: CircuitBreaker
              args:
                name: curriculumServiceCircuitBreaker
                fallbackUri: forward:/fallback/curriculum-service

        - id: curriculum-service-route
          uri: ${CURRICULUM_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/curriculum/**
          filters:
            - name: CircuitBreaker
              args:
                name: curriculumServiceCircuitBreaker
                fallbackUri: forward:/fallback/curriculum-service

        # Submission Service Routes (Port 8083)
        - id: submission-service-route
          uri: ${SUBMISSION_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/submissions/**
          filters:
            - name: CircuitBreaker
              args:
                name: submissionServiceCircuitBreaker
                fallbackUri: forward:/fallback/submission-service

        # Collaboration Service Routes (Port 8084)
        - id: collab-service-route
          uri: ${COLLAB_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/collab/**, /ws-connect/**
          filters:
            - name: CircuitBreaker
              args:
                name: collabServiceCircuitBreaker
                fallbackUri: forward:/fallback/collab-service

codeconnect:
  gateway:
    user-service-uri: ${USER_SERVICE_URI:http://localhost:8081}
    admin-path-pattern: ${ADMIN_PATH_PATTERN:/api/v1/admin/**}
    mentor-path-pattern: ${MENTOR_PATH_PATTERN:/api/v1/mentor/**}
    admin-curriculum-path-pattern: ${ADMIN_CURRICULUM_PATH_PATTERN:/api/v1/admin/curriculum/**}
    internal-secret: ${INTERNAL_SECURITY_SECRET:c0d3c0nn3ct-1nt3rn4l-s3cur1ty-h256-s3cr3t-k3y-m1n32byt3s!}
  session:
    cookie-name: ${SESSION_COOKIE_NAME:APP_SESSION}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
    cookie-same-site: ${SESSION_COOKIE_SAME_SITE:Strict}
    cookie-max-age: ${SESSION_COOKIE_MAX_AGE:7d}
  redis:
    min-idle: ${REDIS_POOL_MIN_IDLE:16}
    max-idle: ${REDIS_POOL_MAX_IDLE:32}
    max-active: ${REDIS_POOL_MAX_ACTIVE:64}
    max-wait-ms: ${REDIS_POOL_MAX_WAIT_MS:1500}
    connect-timeout-ms: ${REDIS_CONNECT_TIMEOUT_MS:2000}
    command-timeout-ms: ${REDIS_COMMAND_TIMEOUT_MS:1500}
    keep-alive: true
    tcp-no-delay: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      access: read_only
  health:
    probes:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
